name: release

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
          - platform: ubuntu-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'tunnel-rs-manager v__VERSION__'
          releaseBody: 'See assets below to download and install.'
          releaseDraft: true
          prerelease: ${{ github.ref_name != 'main' }}
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: insert OS into asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          release_id=$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)
          gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
            --jq '.[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r id name; do
            case "$name" in
              *.msi|*.exe) os=windows ;;
              *.dmg) os=macos ;;
              *.AppImage|*.AppImage.tar.gz|*.AppImage.tar.gz.sig) os=linux ;;
              *) continue ;;
            esac
            newname="${name/_${VERSION}_/_${VERSION}_${os}_}"
            if [ "$newname" != "$name" ]; then
              gh api -X PATCH "/repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$newname"
              echo "renamed $name -> $newname"
            fi
          done

      - name: publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          NOTES=$(gh api -X POST "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)
          gh release edit "$TAG" \
            --draft=false \
            --notes "$NOTES" \
            --repo "$GITHUB_REPOSITORY"
