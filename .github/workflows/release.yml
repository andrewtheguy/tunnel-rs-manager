name: release

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: verify version files are in sync
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # tauri-action derives the release tag from the tauri app config, NOT package.json.
          # If these drift, tauri-action creates a release under the wrong tag and the publish
          # job can't find the tag it expects. Fail fast instead of shipping a broken release.
          tauri_version=$(jq -r .version src-tauri/tauri.conf.json)
          cargo_version=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          if [ "$tauri_version" != "$VERSION" ] || [ "$cargo_version" != "$VERSION" ]; then
            echo "::error::version mismatch: package.json=$VERSION tauri.conf.json=$tauri_version Cargo.toml=$cargo_version"
            exit 1
          fi

      - name: abort if tag already exists
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "::error::Tag $TAG already exists on remote"
            exit 1
          fi

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: ''
          - platform: ubuntu-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            build-essential

      - name: setup bun
        uses: oven-sh/setup-bun@v2

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: install frontend dependencies
        run: bun install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'tunnel-rs-manager v__VERSION__'
          releaseBody: 'See assets below to download and install.'
          releaseDraft: true
          prerelease: ${{ github.ref_name != 'main' }}
          tauriScript: bun run tauri
          args: ${{ matrix.args }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: read version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: insert OS into asset names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The /releases/tags/{tag} endpoint only returns published releases; tauri-action
          # creates a draft (no git tag on the remote yet), so find it in the full list instead.
          release_id=$(gh api "/repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id")
          gh api "/repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate \
            --jq '.[] | "\(.id)\t\(.name)"' | while IFS=$'\t' read -r id name; do
            case "$name" in
              *.msi|*.exe) os=windows ;;
              *.dmg) os=macos ;;
              *.AppImage|*.AppImage.tar.gz|*.AppImage.tar.gz.sig) os=linux ;;
              *) continue ;;
            esac
            newname="${name/_${VERSION}_/_${VERSION}_${os}_}"
            if [ "$newname" != "$name" ]; then
              gh api -X PATCH "/repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$newname"
              echo "renamed $name -> $newname"
            fi
          done

      - name: publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          # A draft release has no git tag on the remote yet, so `gh release edit <tag>`
          # (and any tag-based lookup) fails with "release not found". Find it by id in the
          # full list and PATCH it directly; setting draft=false is what creates the tag.
          release_id=$(gh api "/repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name==\"$TAG\") | .id")
          NOTES=$(gh api -X POST "/repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" --jq .body)
          gh api -X PATCH "/repos/$GITHUB_REPOSITORY/releases/$release_id" \
            -F draft=false \
            -f body="$NOTES"
