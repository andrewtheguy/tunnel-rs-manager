[package]
name = "tunnel-rs-manager"
version = "0.0.40"
description = "A desktop app to manage tunnel-rs client instances"
authors = ["you"]
edition = "2021"

[lib]
name = "tunnel_rs_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "5"
tracing = "0.1"
aes-gcm = "0.10"
scrypt = { version = "0.11", default-features = false, features = ["std"] }
hmac = "0.13"
sha2 = "0.11"
rand = "0.10"
base64 = "0.22"
toml = "0.8"
keyring-core = "1"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[dev-dependencies]
tempfile = "3"
